services:
  graphrag:
    image: tigergraph/graphrag:2.0.1 
    platform: linux/amd64
    container_name: graphrag
    build:
      context: .
      dockerfile: graphrag/Dockerfile
    ports:
      - 6100:8000
    depends_on:
      - graphrag-ecc
      - chat-history
      - tigergraph
    environment:
      SERVER_CONFIG: "/code/configs/server_config.json"
      LOGLEVEL: "INFO"
      USE_CYPHER: "true"
    volumes:
      - ${RUST_AGENT_INFRA_DATA_DIR}/graphrag_data/configs/:/code/configs

  graphrag-ecc:
    image: tigergraph/graphrag-ecc:2.0.1
    platform: linux/amd64
    container_name: graphrag-ecc
    build:
      context: .
      dockerfile: ecc/Dockerfile
    ports:
      - 6101:8001
    environment:
      SERVER_CONFIG: "/code/configs/server_config.json"
      LOGLEVEL: "INFO"
      INIT_EMBED_STORE: "false"
    volumes:
      - ${RUST_AGENT_INFRA_DATA_DIR}/graphrag_data/configs/:/code/configs

  chat-history:
    image: tigergraph/chat-history:2.0.1
    platform: linux/amd64
    container_name: chat-history
    build:
      context: chat-history/
      dockerfile: Dockerfile
    ports:
      - 6102:8002
    environment:
      CONFIG_FILES: "/configs/server_config.json"
      LOGLEVEL: "INFO"
    volumes:
      - ${RUST_AGENT_INFRA_DATA_DIR}/graphrag_data/configs/:/configs

  graphrag-ui:
    image: tigergraph/graphrag-ui:2.0.1 
    platform: linux/amd64
    container_name: graphrag-ui 
    build:
      context: graphrag-ui
      dockerfile: Dockerfile
    ports:
      - 6103:3000
    depends_on:
      - graphrag

        #  nginx:
        #    container_name: nginx
        #    image: nginx:1.30.4
        #    volumes:
        #      - ./configs/nginx.conf:/etc/nginx/conf.d/default.conf
        #    ports:
        #      - "80:80"
        #    depends_on:
        #      - graphrag-ui
        #      - graphrag

  tigergraph:
    image: tigergraph/community:4.2.4
    container_name: tigergraph
    platform: linux/amd64
    ports:
      - "14240:14240"
    volumes:
      - tigergraph_data:/home/tigergraph/tigergraph/data

volumes:
    tigergraph_data:
